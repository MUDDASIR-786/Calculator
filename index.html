<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="head"> CALCULATOR </div>
    <br><br>

    <div class="cal">
        <!-- Display/input field -->
        <input class="p1" type="text" placeholder="0" readonly>

        <!-- Calculator buttons -->
        <div class="d1">
            <a href="#" class="b"><div class="t1">AC</div></a>
            <a href="#" class="b"><div class="t1">+/-</div></a>
            <a href="#" class="b"><div class="t1">%</div></a>
            <a href="#" class="b"><div class="t2">/</div></a>
        </div>

        <div class="d1">
            <a href="#" class="b"><div class="t1">7</div></a>
            <a href="#" class="b"><div class="t1">8</div></a>
            <a href="#" class="b"><div class="t1">9</div></a>
            <a href="#" class="b"><div class="t2">*</div></a>
        </div>

        <div class="d1">
            <a href="#" class="b"><div class="t1">4</div></a>
            <a href="#" class="b"><div class="t1">5</div></a>
            <a href="#" class="b"><div class="t1">6</div></a>
            <a href="#" class="b"><div class="t2">-</div></a>
        </div>

        <div class="d1">
            <a href="#" class="b"><div class="t1">1</div></a>
            <a href="#" class="b"><div class="t1">2</div></a>
            <a href="#" class="b"><div class="t1">3</div></a>
            <a href="#" class="b"><div class="t2">+</div></a>
        </div>

        <div class="d1">
            <a href="#" class="b"><div class="t1">Bac</div></a>
            <a href="#" class="b"><div class="t1">0</div></a>
            <a href="#" class="b"><div class="t1">.</div></a>
            <a href="#" class="b"><div class="t2">=</div></a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
